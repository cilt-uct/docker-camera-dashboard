<!DOCTYPE html>
<html lang="en">
<!-- include header -->
{% include '_head.html' %}

<body class="bg-light">
    <div class="container py-4">
        <!-- View toggle nav btns -->
        <div class="text-center">
            <ul class="nav nav-tabs d-flex justify-content-between align-items-center flex-wrap">
                <!-- Left side: Tabs -->
                <div class="d-flex">
                    <li class="nav-item">
                        <a class="nav-link active" id="viewCamerasBtn" aria-current="page" href="#">Cameras</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" id="viewAgentsBtn" href="#">Capture Agents</a>
                    </li>
                    <!-- <li class="nav-item">
                        <a class="nav-link" id="viewSchedulesBtn" href="#">Schedules</a>
                    </li> -->
                </div>

                <!-- Right side: Logo -->
                <li class="ms-auto">
                    <a class="p-0" href="#">
                        <img src="/cams/resources/images/UCT-logo.png" alt="Logo" class="img-fluid"
                            style="max-height: 50px; width: auto;">
                    </a>
                </li>
            </ul>
        </div>
        <div class="card mb-3 shadow-sm">
            <div class="card-body">

                <!-- Camera filters (shown by default) -->
                <div id="cameraFilters" class="text-center mb-4">
                    <span class="filter-name me-2">Camera Status:</span>
                    <div class="btn-group" role="group">
                        <button class="btn btn-outline-secondary filter-btn active" data-status="all"
                            data-type="camera">
                            All (<span id="count-all-cams">0</span>)
                        </button>
                        <button class="btn btn-outline-success filter-btn" data-status="online" data-type="camera">
                            Online (<span id="count-active">0</span>)
                        </button>
                        <button class="btn btn-outline-danger filter-btn" data-status="offline" data-type="camera">
                            Offline (<span id="count-cam-offline">0</span>)
                        </button>
                    </div>
                </div>

                <!-- Capture Agent filters (hidden by default) -->
                <div id="caFilters" class="text-center mb-4" style="display: none;">
                    <span class="filter-name me-2">Capture Agent Status:</span>
                    <div class="btn-group flex-wrap" role="group">
                        <button class="btn btn-outline-secondary filter-btn active" data-status="all" data-type="ca">
                            All (<span id="count-all-cas">0</span>)
                        </button>
                        <button class="btn btn-outline-info filter-btn" data-status="capturing" data-type="ca">
                            Capturing (<span id="count-ca-capturing">0</span>)
                        </button>
                        <button class="btn btn-outline-success filter-btn" data-status="idle" data-type="ca">
                            Idle (<span id="count-ca-idle">0</span>)
                        </button>
                        <button class="btn btn-outline-danger filter-btn" data-status="error" data-type="ca">
                            Error (<span id="count-ca-error">0</span>)
                        </button>
                        <button class="btn btn-outline-secondary filter-btn" data-status="offline" data-type="ca">
                            Offline (<span id="count-ca-offline">0</span>)
                        </button>
                        <button class="btn btn-outline-warning filter-btn" data-status="unknown" data-type="ca">
                            Unknown (<span id="count-ca-unknown">0</span>)
                        </button>
                    </div>
                </div>

            </div>
        </div>

        <!-- Single dynamic grid for both views -->
        <div id="cameraLoader" class="text-center my-4" style="display:none;">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
            <div>Loading...</div>
        </div>
        <div id="cameraGrid" class="row g-4">
            <!-- Dynamic cards (cameras or agents) -->
        </div>

    </div>

    <!-- Camera Modal -->
    <div class="modal fade" id="cameraModal" tabindex="-1">
        <div class="modal-dialog modal-xl modal-dialog-centered modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="cameraModalTitle"></h5>
                    <button class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <!-- Main Image -->
                    <div class="text-center mb-3">
                        <img id="modalMainImage" class="img-fluid rounded shadow" />
                    </div>
                    <!-- Thumbnails (optional – hidden for now) -->
                    <div id="modalThumbs" class="d-flex gap-2 justify-content-center"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Schedule Modal (unchanged) -->
    <div class="modal fade" id="scheduleModal" tabindex="-1">
        <div class="modal-dialog modal-xl">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Camera Schedule</h5>
                    <div id="scheduleLabel" class="fw-bold me-auto"></div>
                    <div class="ms-auto d-flex gap-2">
                        <select id="cameraFilter" class="form-select form-select-sm">
                            <option value="all">All Cameras</option>
                        </select>
                    </div>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div id="scheduleHeader" class="schedule-header"></div>
                    <div id="scheduleGrid"></div>
                </div>
            </div>
        </div>
    </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar-scheduler@6.1.10/index.global.min.js"></script>
    <script src="/cams/scripts/moments.js"></script>
    <script src="/cams/scripts/scripts.js" defer></script>
    {% include '_footer.html' %}
</body>

</html>
